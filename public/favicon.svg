<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 8 112 112" role="img" aria-labelledby="title">
  <title id="title">墨笺「笺」字朱砂印</title>

  <!-- 朱砂印面：四边略有收放，保留手工钤印的裁切感。 -->
  <path
    fill="#a44736"
    d="M17.8 12.6 109 13.8c3.2 0 5.2 2.3 5.3 5.4l1.2 89.1c0 3.6-2.2 5.7-5.6 5.8l-91.8 1.2c-3.7 0-5.8-2.3-5.7-5.7l1-91.4c0-3.4 1.6-5.4 4.4-5.6Z"
  />

  <!-- 白文边款：断笔与轻微错位模拟印泥在纸纤维上的自然缺口。 -->
  <path
    d="M25.2 25.5 102.6 24.7M103.3 24.9l.8 77.5M103.9 103.2l-78.7.5M24.7 103.2l.6-77"
    fill="none"
    stroke="#f4efe3"
    stroke-width="2.8"
    stroke-linecap="round"
  />

  <!-- 「笺」：以几何路径重绘，不依赖浏览器字体。 -->
  <g fill="none" stroke="#f4efe3" stroke-linecap="round" stroke-linejoin="round">
    <path d="m34.8 31.8-7.2 10.7M30.8 36.6l20.3-.4M44.2 36.8l5.3 7.4" stroke-width="6.3" />
    <path d="m76.6 31.2-6.8 10.9M72.5 36l23-.3M87.2 36.5l6.2 7.1" stroke-width="6.3" />
    <path d="M39.4 54.2 84 53.8M35.4 68.7 82.8 68" stroke-width="6.7" />
    <path d="M61.2 48.4c1.7 17 7 35.2 17.5 45.4 4.8 4.7 10.8 5.7 14.6-2" stroke-width="7.2" />
    <path d="M75.4 76.3C67.2 87.2 56.3 94.6 40.2 99" stroke-width="7.2" />
    <path d="m82.7 57.7 9.6 7" stroke-width="6.5" />
  </g>

  <!-- 三处微小露朱砂控制旧印气息；尺寸低于 32px 时自然并入笔画。 -->
  <path
    fill="#a44736"
    d="m30.8 35.2 5.1-.1-.8 2.7-4.5.1ZM66.2 67.8l5.6-.1-1 2.9-4.1.1ZM73.3 87.2l4.2-4 .9 3.2-3.7 3.4Z"
  />
</svg>
